<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1 - Li'l Champs Vedic Mathematics</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #F7FAFC; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-nav { background: white; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; display: flex; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #1A365D; }
        .logo span { color: #F6AD55; }
        .course-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; background: #1A365D; color: white; overflow-y: auto; padding-top: 20px; }
        .chapter-list { list-style: none; }
        .chapter-list li { padding: 15px 20px; cursor: pointer; border-left: 4px solid transparent; }
        .chapter-list li:hover { background: rgba(255,255,255,0.05); }
        .chapter-list li.active { background: rgba(255,255,255,0.1); border-left: 4px solid #F6AD55; font-weight: 600; }
        .content-area { flex: 1; overflow-y: auto; padding: 40px; background: white; }
        .chapter-content { display: none; max-width: 800px; margin: 0 auto; }
        .chapter-content.active-content { display: block; }
        .sutra-box { background: #EBF8FF; border-left: 5px solid #3182CE; padding: 20px; margin: 20px 0; border-radius: 0 8px 8px 0; }
        .abacus-box { background: #FEFCBF; border: 1px solid #F6AD55; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .abacus-box h4 { color: #C05621; margin-bottom: 10px; }
        .practice-box { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .practice-box input { padding: 5px; margin-left: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100px; }
        .practice-box p { margin-bottom: 10px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="logo"><span>Li'l Champs</span> Academy</div>
        <a href="index.html" style="text-decoration: none; color: #1A365D; font-weight: 600;">← Back to Home</a>
    </header>
    <div class="course-container">
        <aside class="sidebar">
            <h3 style="padding: 0 20px 20px; color: #F6AD55; border-bottom: 1px solid rgba(255,255,255,0.1);">Level 1: Basic</h3>
            <ul class="chapter-list" id="sidebar-list"></ul>
        </aside>
        <main class="content-area" id="main-content"></main>
    </div>

    <script>
        const chapters = [
            { title: "Digit Sums (Navashesh)", type: "add" },
            { title: "Speed Addition Left to Right", type: "add" },
            { title: "Subtraction (Nikhilam)", type: "sub" },
            { title: "Vinculum - Taming Big Numbers", type: "sub" },
            { title: "Multiplication by 11s and 9s", type: "mult" },
            { title: "Base Multiplication near 10/100", type: "mult" },
            { title: "Crosswise Multiplication 2-Digit", type: "mult" },
            { title: "Crosswise Multiplication 3-Digit", type: "mult" },
            { title: "Multiplication Special Rules", type: "mult" },
            { title: "Squaring Numbers Instantly", type: "square" },
            { title: "Verifying with Digital Roots", type: "square" },
            { title: "Division by Single Digits", type: "div" },
            { title: "Doubling and Halving", type: "mult" },
            { title: "Simple Percentages", type: "mult" },
            { title: "Mixed Operations", type: "add" },
            { title: "Final Assessment", type: "mult" }
        ];

        const sidebarList = document.getElementById('sidebar-list');
        const mainContent = document.getElementById('main-content');

        chapters.forEach((ch, index) => {
            // Build Sidebar
            let li = document.createElement('li');
            li.innerText = `Ch ${index + 1}: ${ch.title}`;
            if (index === 0) li.classList.add('active');
            li.onclick = () => showChapter(index);
            sidebarList.appendChild(li);

            // Build Content
            let section = document.createElement('section');
            section.className = `chapter-content ${index === 0 ? 'active-content' : ''}`;
            section.id = `ch-${index}`;
            
            let html = `<h2>Chapter ${index + 1}: ${ch.title}</h2>
                <div class="sutra-box"><strong>The Secret Code:</strong> Vedic Sutra Application<br><strong>The Superpower:</strong> Calculate lightning fast in your mind.</div>
                <p>This chapter replaces step-by-step school math with single-line Vedic mental math. Move from left to right, just as you read.</p>
                <div class="abacus-box"><h4>🧮 The Abacus Connection</h4><p>Remember your fingering rules: thumb for +1,2,3,4. Middle finger for +5. Left thumb for +10. Map the numbers directly onto your mental rods. Think '5 down' or '1 down' instead of 'minus'.</p></div>
                <h3>✍ Practice Time (Short clear your mental abacus!)</h3>
                <div class="practice-box">`;

            // Auto-generate 10 practice problems
            for(let i=1; i<=10; i++) {
                let prob = "";
                if(ch.type === 'add') prob = `${Math.floor(Math.random()*900)+100} + ${Math.floor(Math.random()*900)+100} =`;
                if(ch.type === 'sub') prob = `${Math.floor(Math.random()*8000)+1000} - ${Math.floor(Math.random()*900)+100} =`;
                if(ch.type === 'mult') prob = `${Math.floor(Math.random()*900)+100} × ${Math.floor(Math.random()*90)+10} =`;
                if(ch.type === 'div') prob = `${Math.floor(Math.random()*8000)+1000} ÷ ${Math.floor(Math.random()*8)+2} =`;
                if(ch.type === 'square') prob = `${Math.floor(Math.random()*80)+15}² =`;
                html += `<p><strong>${i}.</strong> ${prob} <input type="text"></p>`;
            }

            html += `</div><h3 style="margin-top:20px;">⏱ Mental Math Sprint (2 Mins!)</h3><div class="practice-box">`;
            for(let i=1; i<=5; i++) {
                html += `<p>Sprint ${i}: [ ${Math.floor(Math.random()*90)+10} + ${Math.floor(Math.random()*90)+10} × ${Math.floor(Math.random()*8)+2} ] = <input type="text"></p>`;
            }
            html += `</div>`;
            section.innerHTML = html;
            mainContent.appendChild(section);
        });

        function showChapter(index) {
            document.querySelectorAll('.chapter-content').forEach(c => c.classList.remove('active-content'));
            document.querySelectorAll('.chapter-list li').forEach(l => l.classList.remove('active'));
            document.getElementById(`ch-${index}`).classList.add('active-content');
            sidebarList.children[index].classList.add('active');
            document.querySelector('.content-area').scrollTo(0,0);
        }
    </script>
</body>
</html>
